# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Python Programming
author: Yaé U. Gaba
logo: notebooks/images/banner.jpeg
copyright: "2024–2025. CC0 Licensed — use as you like. Appropriate credit is very welcome."

# MyST parser extensions
parse:
  myst_enable_extensions:
    - colon_fence      # allow ::: fences alongside ``` for admonitions
    - deflist          # definition lists
    - dollarmath       # inline $...$ math
    - html_image       # <img> tags
    - linkify          # auto-link bare URLs
    - substitution     # {{ var }} substitutions
    - tasklist         # - [ ] task lists

# Notebook execution — off for now (some lectures need scientific stack)
execute:
  execute_notebooks: off
  timeout: -1

# Repository — used for GitHub buttons and to derive Colab launch URLs
repository:
  url: https://github.com/ai-technipreneurs/python_website
  branch: main

# HTML theme options
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  home_page_in_navbar: true
  baseurl: https://ai-technipreneurs.github.io/python_website/
  extra_navbar: ""

# Colab launch button — resolves to https://colab.research.google.com/github/<repo>/blob/<branch>/<path>
launch_buttons:
  colab_url: "https://colab.research.google.com"
  notebook_interface: jupyterlab

# Sphinx extras
sphinx:
  extra_extensions:
    - sphinx_design    # cards, grids, tabs
  config:
    # `notebook-assets/` mirrors notebooks/*.{png,jpeg,...}. Sphinx copies
    # its contents verbatim to output root, preserving structure — so the
    # mirror's `notebooks/foo.jpeg` becomes `_build/html/notebooks/foo.jpeg`
    # and the raw <img src="foo.jpeg"> tags inside the built notebook pages
    # resolve. Cannot point at notebooks/ directly — Sphinx would then
    # treat the whole tree as excluded from the docs build.
    html_extra_path: ["notebook-assets"]
